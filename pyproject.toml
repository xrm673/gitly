[project]
name = "gitly"
version = "0.1.0"
description = "Git without typing commands: arrow-key menus, plain-English explanations, and an AI helper that always shows you the command first."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "textual>=8.0",
    "anthropic>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual-dev"]

[project.scripts]
gitly = "gitly.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
